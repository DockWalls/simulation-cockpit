version: "3.3"
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: changeme
      POSTGRES_USER: marquez
      POSTGRES_DB: marquez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["5433:5432"]   # optional, for local psql
    volumes: ["pgdata:/var/lib/postgresql/data"]

  marquez:
    image: marquezproject/marquez:latest
    environment:
      MARQUEZ_CONFIG: "environment"
      MARQUEZ_DB_HOST: postgres
      MARQUEZ_DB_PORT: 5432
      MARQUEZ_DB: marquez
      MARQUEZ_USER: marquez
      MARQUEZ_PASSWORD: changeme
    ports: ["5002:5000","3002:3000"]  # 5000 API, 3002 UI

volumes:
  pgdata: {}
