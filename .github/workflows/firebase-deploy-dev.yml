name: Firebase Deploy (Staging)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up service account credentials
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > $HOME/gcloud.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcloud.json"

      - name: Deploy to Staging Channel
        if: success()
        run: firebase hosting:channel:deploy staging --expires 7d --project simulation-cockpit
