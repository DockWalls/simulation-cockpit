apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: event-pipeline
  namespace: jallybean-telemetry
spec:
  params:
    - name: event-id
      type: string
      default: unknown
    - name: metric-value
      type: string
      default: "0"
  tasks:
    - name: echo
      params:
        - name: event-id
          value: $(params.event-id)
        - name: metric-value
          value: $(params.metric-value)
      taskSpec:
        params:
          - name: event-id
            type: string
          - name: metric-value
            type: string
        steps:
          - name: say
            image: alpine:3.20
            script: |
              echo "Event ID: $(params.event-id)"
              echo "Metric Value: $(params.metric-value)"
