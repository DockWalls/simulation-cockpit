version: "3.3"

services:

  # Marquez
  marquez:
    image: marquezproject/marquez:0.32.0
    environment:
      MARQUEZ_DB_HOST: postgres
      MARQUEZ_DB_PORT: 5432
      MARQUEZ_DB_USER: marquez
      MARQUEZ_DB_PASSWORD: marquez
      MARQUEZ_NAMESPACE: default
    ports:
      - "5000:5000"     # API port
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/namespaces"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Marquez DB
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5435:5432"

  # DataHub (uses Quickstart)
  datahub-frontend-react:
    image: acryldata/datahub-frontend-react:head
    ports:
      - "9002:9002"
    depends_on:
      - datahub-gms
    environment:
      DATAHUB_GMS_HOST: datahub-gms

  datahub-gms:
    image: acryldata/datahub-gms:head
    ports:
      - "8080:8080"
    environment:
      DATAHUB_DB_HOST: mysql
      DATAHUB_DB_PORT: 3306
      DATAHUB_DB_USERNAME: datahub
      DATAHUB_DB_PASSWORD: datahub

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
    ports:
      - "3306:3306"

volumes:
  pgdata: {}
