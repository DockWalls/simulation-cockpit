loki:
  useTestSchema: false

  # TSDB schema with S3 object store (Loki 3.x)
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: evidence
      ruler: evidence

  commonConfig:
    path_prefix: /var/loki
    storage:
      s3:
        endpoint: minio.jallybean-telemetry.svc.cluster.local:9000
        accessKeyId: evidenceadmin
        secretAccessKey: "EvidenceAdmin#2025!"
        s3ForcePathStyle: true
        insecure: true   # http

# Make sure components have a writable work dir (emptyDir is fine)
write:
  extraVolumeMounts:
    - name: loki-tmp
      mountPath: /var/loki
  extraVolumes:
    - name: loki-tmp
      emptyDir: {}

backend:
  extraVolumeMounts:
    - name: loki-tmp
      mountPath: /var/loki
  extraVolumes:
    - name: loki-tmp
      emptyDir: {}
